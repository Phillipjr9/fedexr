<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>FedEx - Shipping & Tracking</title>
  <script>
    // Single Page App redirect for GitHub Pages / static hosting
    const segment = 1;
    const l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, segment + 1).join('/') + '/?p=/' +
      l.pathname.slice(1).split('/').slice(segment).join('/').replace(/&/g, '~and~') +
      (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
  Redirecting...
</body>
</html>
