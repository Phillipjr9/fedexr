name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  account-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci --prefix server
      - run: npm run test:accounts
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci --prefix app
      - run: npm ci --prefix server
      - run: cd app && ./node_modules/.bin/tsc -p tsconfig.app.json --noEmit
      - run: npm --prefix app run build
      - run: cd app && npx playwright install --with-deps chromium
      - run: npm --prefix app run test:e2e -- --workers=1
      - run: PLAYWRIGHT_SERVER_ACCOUNTS=1 npm --prefix app run test:e2e -- accounts-server.spec.ts --workers=1
